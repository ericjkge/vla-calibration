# Separate environment for the LIBERO-Plus simulator and rollout client.
# LIBERO pins old robosuite/MuJoCo versions that conflict with the model env,
# so the sim talks to the policy server over a websocket via openpi-client.

[project]
name = "vlacal-sim"
version = "0.1.0"
requires-python = ">=3.8,<3.9"
dependencies = [
    "openpi-client",
    "typing-extensions>=4.5",
    "numpy==1.22.4",
    "torch==1.11.0+cpu",
    "torchvision==0.12.0+cpu",
    "robosuite==1.4.1",
    "mujoco==2.3.7",
    "robomimic==0.2.0",
    "bddl==1.0.1",
    "gym==0.25.2",
    "easydict==1.9",
    "cloudpickle==2.1.0",
    "opencv-python==4.6.0.66",
    "matplotlib==3.5.3",
    "imageio[ffmpeg]==2.31.6",
    "pyyaml==6.0.2",
    "setuptools<76",
    "wheel",
]

[tool.uv]
environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]

[tool.uv.sources]
openpi-client = { path = "../third_party/openpi/packages/openpi-client" }
torch = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
