[project]
name = "vlacal"
version = "0.1.0"
description = "Robust calibration for post-training quantization of VLA policies"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[dependency-groups]
dev = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["third_party"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
